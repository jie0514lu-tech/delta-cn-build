name: Build Delta CN IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout recipe
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XC" ]; then XC="/Applications/Xcode.app"; fi
          echo "using: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          sw_vers

      - name: Clone Delta (pinned commit) + submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          SHA=$(tr -d '[:space:]' < PATCHED_COMMIT)
          echo "pinned commit: $SHA"
          git clone --no-checkout https://github.com/rileytestut/Delta.git src
          cd src
          git checkout "$SHA"
          git submodule update --init --recursive --depth 1
          echo "submodules:"; git submodule status | head -20

      - name: Apply translation patch + overlay
        run: |
          cd src
          git apply -v ../patch/delta-cn.patch
          cp -R ../overlay/. .
          echo "--- 本地化资源 ---"
          ls -la Resources/zh-Hans.lproj Resources/en.lproj
          echo "--- 语言管理器 ---"
          ls -la Delta/Localization/LanguageManager.swift
          echo "--- 唯一进入 App 的代码改动 ---"
          grep -n "applyStoredLanguage" Delta/AppDelegate.swift
          grep -n "LanguageSection" Delta/Settings/SettingsView.swift
          grep -n "CFBundleLocalizations" "Delta/Supporting Files/Info.plist"

      - name: Handled strings post-build (drop from Resources phase)
        run: |
          cd src
          python3 - <<'PY'
          import re
          p = "Delta.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf-8").read()
          pat = re.compile(r"^[ \t]+[0-9A-F]{24} /\* Localizable\.strings in Resources \*/,\n", re.M)
          before = len(pat.findall(s))
          s2 = pat.sub("", s)
          open(p, "w", encoding="utf-8").write(s2)
          print("removed entries:", before)
          assert before == 1, "expect exactly one build-phase entry"
          PY

      - name: Install CocoaPods
        run: |
          pod --version || sudo gem install cocoapods --no-document
          pod --version

      - name: pod install
        run: |
          cd src
          pod install --repo-update

      - name: Build (unsigned)
        run: |
          cd src
          set -o pipefail
          xcodebuild \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log | tail -n 200

      - name: Post-process bundle + package IPA
        run: |
          cd src
          APP=$(find build/Build/Products -maxdepth 3 -name 'Delta.app' -type d | head -n 1)
          echo "APP=$APP"
          test -d "$APP" || { echo "构建失败：找不到 Delta.app"; tail -n 200 build.log; exit 1; }

          for L in zh-Hans en; do
            mkdir -p "$APP/$L.lproj"
            for f in Resources/$L.lproj/*.strings; do
              [ -e "$f" ] || continue
              cp -f "$f" "$APP/$L.lproj/"
            done
          done

          echo "--- bundle 内本地化 ---"
          ls -la "$APP/zh-Hans.lproj"
          /usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$APP/Info.plist"

          rm -rf Payload Delta-CN-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Delta-CN-unsigned.ipa Payload
          ls -lh Delta-CN-unsigned.ipa
          shasum -a 256 Delta-CN-unsigned.ipa | tee sha256.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Delta-CN-unsigned-ipa
          path: |
            src/Delta-CN-unsigned.ipa
            src/sha256.txt
            src/build.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: src/build.log
