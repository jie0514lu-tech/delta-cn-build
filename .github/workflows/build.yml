name: Build Delta CN IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout recipe
        uses: actions/checkout@v4

      - name: Select Xcode (26.4.1 优先，规避 actool .icon 崩溃)
        run: |
          ls /Applications | grep -i '^Xcode' || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XC" ]; then XC="/Applications/Xcode.app"; fi
          echo "using: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          sw_vers

      - name: Clone Delta (pinned commit) + submodules
        run: |
          export GIT_TERMINAL_PROMPT=0
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          SHA=$(tr -d '[:space:]' < PATCHED_COMMIT)
          echo "pinned commit: $SHA"
          for attempt in 1 2 3; do
            echo "clone attempt $attempt"
            rm -rf src
            if git clone --no-checkout https://github.com/rileytestut/Delta.git src; then break; fi
            sleep 15
          done
          test -d src/.git || { echo "clone 失败"; exit 1; }
          cd src
          git checkout "$SHA"
          for attempt in 1 2 3; do
            if git submodule update --init --recursive --depth 1; then break; fi
            sleep 15
          done
          echo "submodules:"; git submodule status | head -20

      - name: Apply translation patch + overlay
        run: |
          cd src
          git apply -v ../patch/delta-cn.patch
          cp -R ../overlay/. .
          echo "--- 本地化资源 ---"
          ls -la Resources/zh-Hans.lproj Resources/en.lproj
          echo "--- 语言管理器 ---"
          ls -la Delta/Localization/LanguageManager.swift
          echo "--- 唯一进入 App 的代码改动 ---"
          grep -n "applyStoredLanguage" Delta/AppDelegate.swift
          grep -n "LanguageSection" Delta/Settings/SettingsView.swift
          grep -n "CFBundleLocalizations" "Delta/Supporting Files/Info.plist"


      - name: Install CocoaPods
        run: |
          pod --version || sudo gem install cocoapods --no-document
          pod --version
      - name: pod install
        run: |
          cd src
          pod install --repo-update

      - name: Toolchain shim (CoreData 映射模型的编译期版本标记)
        run: |
          cd src
          python3 - <<'PY'
          import glob, re
          # 上游映射模型由更高版本 Xcode 生成（Persistence-1629），
          # runner 最新 Xcode 26.6 的 momc 只支持到 1526，会直接报错中断编译。
          # 这里只把编译期兼容性标记降到 SDK 支持的值，不改任何实体/属性映射与数据结构。
          total = 0
          for path in glob.glob("Delta/Database/Model/Migrations/*.xcmappingmodel/xcmapping.xml"):
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              def repl(m):
                  return m.group(1) + "1526" + m.group(3)
              new = re.sub(r"(<key>NSPersistence(?:Maximum)?FrameworkVersion</key>\s*<integer>)(\d+)(</integer>)",
                           repl, text)
              if new != text:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new)
                  total += 1
                  print("shimmed:", path)
          print("total shimmed:", total)
          PY

      - name: Replace Icon Composer .icon with classic AppIcon (actool Xcode 26 bug)
        run: |
          cd src
          set -e
          ICON_DIR=Resources/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON_DIR"
          cp Resources/Icons.xcassets/Raw/AppIcon.imageset/GlassIcon_Light.png "$ICON_DIR/AppIcon-1024.png"
          cp Resources/Icons.xcassets/Raw/AppIcon.imageset/GlassIcon_Dark.png  "$ICON_DIR/AppIcon-1024-dark.png"
          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              },
              {
                "appearances" : [
                  {
                    "appearance" : "luminosity",
                    "value" : "dark"
                  }
                ],
                "filename" : "AppIcon-1024-dark.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          python3 - <<'PY'
          import re
          p = "Delta.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf-8").read()
          # 1) 移除 Icon Composer .icon
          pat1 = re.compile(r"^[ \t]+[0-9A-F]{24} /\* (?:AppIcon|MicrochipIcon)\.icon in Resources \*/,\n", re.M)
          found1 = pat1.findall(s)
          s = pat1.sub("", s)
          # 2) 备用图标 catalog（含大量 appiconset）在 CI 环境同样触发 actool 崩溃，一并移出编译
          pat2 = re.compile(r"^[ \t]+[0-9A-F]{24} /\* Icons\.xcassets in Resources \*/,\n", re.M)
          found2 = pat2.findall(s)
          s = pat2.sub("", s)
          open(p, "w", encoding="utf-8").write(s)
          print("removed .icon entries:", len(found1), " removed Icons.xcassets entries:", len(found2))
          PY
          ls -la "$ICON_DIR"


      - name: Build (unsigned)
        run: |
          cd src
          ACTOOL="$(xcode-select -p)/usr/bin/actool"
          {
            echo "=== actool self-test (Assets.xcassets + AppIcon.appiconset) ==="
            mkdir -p /tmp/actout
            "$ACTOOL" Resources/Assets.xcassets --compile /tmp/actout \
              --output-format human-readable-text --notices --warnings \
              --platform iphoneos --minimum-deployment-target 17.4 \
              --target-device iphone --target-device ipad \
              --app-icon AppIcon --bundle-identifier com.rileytestut.Delta \
              --development-region English < /dev/null 2>&1 | tail -n 12
            echo "self-test exit: $?"
            echo "=== xcodebuild ==="
          } > build.log 2>&1
          set +e
          xcodebuild \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build < /dev/null >> build.log 2>&1
          STATUS=$?
          tail -n 120 build.log
          echo "xcodebuild exit: $STATUS"
          exit $STATUS

      - name: Post-process bundle + package IPA
        run: |
          cd src
          APP=$(find build/Build/Products -maxdepth 3 -name 'Delta.app' -type d | head -n 1)
          echo "APP=$APP"
          test -d "$APP" || { echo "构建失败：找不到 Delta.app"; tail -n 200 build.log; exit 1; }

          for L in zh-Hans en; do
            mkdir -p "$APP/$L.lproj"
            for f in Resources/$L.lproj/*; do
              [ -e "$f" ] || continue
              cp -f "$f" "$APP/$L.lproj/"
            done
          done

          echo "--- bundle 内本地化 ---"
          ls -la "$APP/zh-Hans.lproj"
          /usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$APP/Info.plist"

          rm -rf Payload Delta-CN-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Delta-CN-unsigned.ipa Payload
          ls -lh Delta-CN-unsigned.ipa
          shasum -a 256 Delta-CN-unsigned.ipa | tee sha256.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Delta-CN-unsigned-ipa
          path: |
            src/Delta-CN-unsigned.ipa
            src/sha256.txt
            src/build.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: src/build.log
